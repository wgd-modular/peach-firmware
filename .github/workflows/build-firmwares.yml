name: Build Firmwares (reusable)

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
      attach-to-release:
        required: false
        type: boolean
        default: false
      tag-name:
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.72.2
          cache: true

      - name: Build firmwares
        run: pixi run build

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          for binary in src/*/build/*.ino.bin; do
            name=$(basename "$binary" .ino.bin)
            cp "$binary" "artifacts/$name.bin"
          done

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmwares-${{ github.sha }}
          path: artifacts/*.bin
          if-no-files-found: error

      - name: Attach firmwares to release
        if: ${{ inputs.attach-to-release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-name }}
          files: artifacts/*.bin
