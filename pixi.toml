[workspace]
name = "peach-firmware"
description = "Firmwares for the Peach Eurorack oscillator module"
authors = ["Felix Wiegand <fxwiegand@googlemail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.12"
git = "*"

[tasks.setup]
description = "Install the pinned arduino-cli, Seeed RA4M1 core and AGTimer R4 library"
cmd = "python build_firmwares.py --setup"

[tasks.build]
description = "Build all firmwares, or only the one named"
args = [{ arg = "firmware", default = "" }]
cmd = "python build_firmwares.py {{ firmware }}"
depends-on = ["setup"]

[tasks.clean]
description = "Remove all build output"
cmd = "python build_firmwares.py --clean"
